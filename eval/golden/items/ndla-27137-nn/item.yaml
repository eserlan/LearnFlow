  qualifiers:
    - quote: i utgangspunktet
      note: Luther first wanted reform, not a split.
    - quote: men makt, rikdom og frigjering frå paven var nok medverkande årsaker
      note: '"nok" and "medverkande": a likely contributing reason, not the reason. Many princes were also convinced Lutherans.'
    - quote: Fleire kongar og fyrstar var overtydde lutheranarar
    - quote: Kyrkja skulle i mindre grad vere eit mellomledd
      note: Less of a go-between, not none at all.
    - quote: Dei forstod kanskje ikkje kva orda betydde
    - quote: er truleg opphavet til trylleformularet Hokus Pokus
    - quote: Det er uvisst om trylleformularet oppstod før reformasjonen
    - quote: ifølgje den katolske kyrkja
      note: The transformation of bread and wine is the Catholic church's teaching, not stated as fact.
    - quote: mange katolikkar meiner framleis i dag
    - quote: men samtidig var det sider ved Luthers lære som la grunnen for ei slik utvikling
      note: Keeps the balance in the last section; 1500s Lutheranism was not liberal.
  expectations:
    - "Religious teachings are reported as what each church or person believes (\"Luther meinte\", \"i katolsk tru\"), never as facts."
    - "Both perspectives stay: the Lutheran story and the Catholic view that it was a catastrophe. The simplified text does not take a side."
    - "\"Hoc est corpus meum\" stays word for word in Latin, with its translation."
    - "The name is kept as written in the source (\"Johan Gutenberg\"), not silently corrected."
    - "\"20 år etter Luthers brot\" is not turned into a year the source does not give."
    - "The opening question of the Latin section (\"Er det noko kjent med desse orda?\") stays a question for the reader."
    - "Written in Nynorsk throughout; no Bokmål forms."
