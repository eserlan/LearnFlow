annotations:
  keyFacts:
    - id: f1
      core: true
      statement: Under reformasjonen braut fleire statar med paven og laga sine eigne statskyrkjer.
      sourceQuote: Fleire statar bryt med paven og dannar sine eigne statskyrkjer.
    - id: f2
      core: true
      statement: Martin Luther, ein tysk munk og teologiprofessor, starta protesten i 1517. Han ville først reformere den katolske kyrkja, men blei bannlyst av paven.
      sourceQuote: Han ønskte i utgangspunktet å reformere den katolske kyrkja, men blei i staden bannlyst av paven.
    - id: f3
      statement: Kyrkja var alt svekt av pavesetet i Avignon, periodar med fleire pavar samtidig, og svartedauden.
      sourceQuote: Fleire hendingar på 1300- og 1400-talet hadde svekt stillinga til kyrkja i Europa.
    - id: f4
      core: true
      statement: Luther var inspirert av humanismen. For han var Bibelen den einaste kjelda til rett tru, og han ville ha Bibelen omsett til lokale språk.
      sourceQuote: For Luther var Bibelen den einaste kjelda til rett tru.
    - id: f5
      statement: Boktrykkjarkunsten, som Gutenberg fann opp på midten av 1400-talet, hjelpte reformatorane å spreie bodskapen og omsette biblar.
      sourceQuote: Denne teknologien blei flittig brukt av Luther og andre reformatorar for å spreie bodskapen sin
    - id: f6
      core: true
      statement: Avlatshandelen, der kyrkja selde avlatsbrev for å sleppe straff i skjærselden, var ein viktig del av Luthers protest.
      sourceQuote: Ein viktig del av Luthers protest var avlatshandelen.
    - id: f7
      core: true
      statement: Mange tyske fyrstar støtta Luther. Dei fekk meir makt og rikdom når kyrkja blei statskyrkje og staten tok over eigedommane.
      sourceQuote: Eigedommane til kyrkja blei overtekne av staten, og kongen blei overhovudet til den nye statskyrkja.
    - id: f8
      core: true
      statement: Luther meinte menneska blir frelste gjennom trua åleine, og at tilgiving er ei sak mellom den enkelte og Gud.
      sourceQuote: Luther meinte dette var ei sak mellom den enkelte angrande synder og Gud.
    - id: f9
      statement: I protestantiske land blei synd straffa etter statlege lover, og hekseprosessane var verst på 1600-talet.
      sourceQuote: Det er på denne tida hekseprosessane er på sitt verste, og dei protestantiske landa dominerte statistikken.
    - id: f10
      statement: Den katolske kyrkja har to kjelder (Bibelen og tradisjonen); Luther meinte berre Bibelen skulle gjelde.
      sourceQuote: Den katolske kyrkja har to kjelder til kva som er rett tradisjon
    - id: f11
      statement: Hoc est corpus meum betyr "Dette er lekamen min" og er truleg opphavet til Hokus Pokus.
      sourceQuote: Hoc est corpus meum betyr "Dette er lekamen min", og er truleg opphavet til trylleformularet Hokus Pokus.
    - id: f12
      statement: Avtalen i Augsburg i 1555 lét fyrstane velje kyrkje. Konflikten blei avgjord med freden i Westfalen i 1648, som gav oss ideen om suverene statar.
      sourceQuote: Konflikten heldt likevel fram og blei først avgjort etter trettiårskrigen i fredsavtalen i Westfalen (1648).
    - id: f13
      statement: Noreg fekk ei luthersk kyrkje 20 år etter Luthers brot. Lutheranarar er i dag rundt 10 % av protestantane i verda.
      sourceQuote: Lutherske kristne utgjer i dag rundt 10 % av protestantane i verda
    - id: f14
      statement: Frå eit katolsk perspektiv var reformasjonen ein katastrofe. Avlatshandelen blei forboden i 1567.
      sourceQuote: Frå eit katolsk perspektiv var reformasjonen ein katastrofe.
    - id: f15
      statement: I 2017 var det 500 år sidan reformasjonen, og det blei diskutert om det var noko å feire.
      sourceQuote: I 2017 var det 500 år sidan Martin Luther starta reformasjonen sin.
