  qualifiers:
    - quote: Dei fleste jordskjelv skjer langs plategrenser.
      note: Most, not all; Norway is the counter-example.
    - quote: som oftast når to plater kolliderer
    - quote: Dei fleste er små
    - quote: spesielt der bygningar ikkje toler ristingane
    - quote: Nokre av desse landa vart trefte av tsunamibølger, mens andre slapp unna.
      note: Do not say all the warned countries were hit.
    - quote: Rike land har som regel råd
    - quote: Fattige land har ofte dårleg råd
      note: '"som regel" and "ofte" keep this from being a blanket claim about rich and poor countries.'
    - quote: risikoen nokre stader vil vere større
  expectations:
    - "The magnitude comparison keeps both numbers and both quantities: ten times stronger shaking, 32 times more energy. Mixing them up (e.g. \"ten times more energy\") is a factual error."
    - "The three magnitude bands stay three, with their ranges unchanged."
    - "Focus, fault (forkasting) and epicentre stay distinct; the epicentre is on the surface above the focus."
    - "The point that buildings, not the shaking itself, cause most deaths is kept."
    - "The NORSAR box may be shortened but keeps the organisation's name and what the website shows. The URL may be kept or left out, but never changed."
    - "Written in Nynorsk throughout; no Bokmål forms."
