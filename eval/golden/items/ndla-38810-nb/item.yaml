annotations:
  keyFacts:
    - id: f1
      core: true
      statement: Plantene tar opp karbondioksid og vann og lager sukker (glukose) og oksygen.
      gist: "Plantene lager sukker og oksygen av karbondioksid og vann."
      sourceQuote: Plantene tar opp karbondioksid (CO2) og vann (H2O) og produserer sukker/glukose (C6H12O6) og
        oksygen (O2).
    - id: f2
      core: true
      statement: Energien som driver fotosyntesen, kommer fra lys.
      gist: "Energien til fotosyntesen kommer fra lys."
      sourceQuote: Plantene bruker energien fra lyset til å drive fotosyntesen.
    - id: f3
      core: true
      statement: Alt liv på jorda er direkte eller indirekte avhengig av stoffene fotosyntesen lager.
      gist: "Alt liv på jorda er direkte eller indirekte avhengig av fotosyntesen."
      sourceQuote: Alle levende organismer på jorda er direkte eller indirekte avhengige av de organiske stoffene
        som produseres i fotosyntesen.
    - id: f4
      statement: Plantene bruker sukkeret som byggemateriale for å vokse.
      sourceQuote: Litt forenklet kan vi si at sukkeret er byggemateriale som plantene bruker for å vokse og bli større.
    - id: f5
      statement: Sukkeret er også en energikilde; energien frigjøres i respirasjonen.
      sourceQuote: Sukkeret brukes også som energikilde, og denne energien frigjøres i det vi kaller respirasjonen.
    - id: f6
      statement: Plantene kan lagre sukker som stivelse, for eksempel i poteten og kålrota.
      sourceQuote: I poteten eller kålrota er sukkeret omdannet til stivelse som fungerer som opplagsnæring.
    - id: f7
      core: true
      statement: Fotosyntesen skjer i kloroplaster i de grønne plantedelene, og klorofyllet i dem gir den grønne fargen.
      gist: "Fotosyntesen skjer i kloroplastene i de grønne delene av planta."
      sourceQuote: Det er klorofyllet som gir den grønne fargen på bladene.
    - id: f8
      statement: Klorofyllet fanger energien i lyset (lysreaksjonen); energien brukes til å binde karbondioksid til
        sukker (calvinsyklus).
      sourceQuote: Energien sendes videre til andre deler i kloroplasten og brukes til å drive prosessen der
        karbondioksid bindes og blir til sukker (calvinsyklus).
    - id: f9
      core: true
      statement: Viktige faktorer for effektiv fotosyntese er lys, vann, næring, temperatur og CO2.
      gist: "Lys, vann, næring, temperatur og CO2 påvirker hvor effektiv fotosyntesen er."
      sourceQuote: "Det følgende er viktige faktorer i dette arbeidet:"
    - id: f10
      statement: I våre områder er fotosyntesen mest effektiv rundt 20–25 °C.
      sourceQuote: mest effektiv rundt 20–25 °C.
    - id: f11
      statement: Uten lys eller uten CO2 stopper fotosyntesen.
      sourceQuote: Uten CO2 stopper fotosyntesen.
  keyTerms:
    - term: fotosyntese
    - term: respirasjonen
      sourceDefinition: denne energien frigjøres i det vi kaller respirasjonen
    - term: stivelse
    - term: opplagsnæring
    - term: kloroplaster
      sourceDefinition: kloroplaster, som er små korn inne i cellene
    - term: klorofyll
      sourceDefinition: Det er klorofyllet som fanger energien i lyset
    - term: lysreaksjonen
      sourceDefinition: Det er klorofyllet som fanger energien i lyset, og membranene fungerer nesten som
        solcellepaneler. Denne prosessen kalles lysreaksjonen.
    - term: calvinsyklus
      sourceDefinition: prosessen der karbondioksid bindes og blir til sukker (calvinsyklus)
    - term: spalteåpningene
  mustPreserve:
    - value: CO2
      kind: formula
    - value: H2O
      kind: formula
    - value: C6H12O6
      kind: formula
    - value: O2
      kind: formula
    - value: 20–25 °C
      kind: unit
    - value: karbondioksid
      kind: term
    - value: glukose
      kind: term
  qualifiers:
    - quote: direkte eller indirekte
      note: Not every organism eats plants; dropping this overstates the claim.
    - quote: I våre områder
      note: The 20–25 °C range is regional, not universal.
    - quote: nesten som solcellepaneler
      note: An analogy, not a literal claim. Must stay an analogy ("nesten som", "litt som").
    - quote: Selve fotosyntesen krever lite vann.
      note: Easy to turn into "plants need a lot of water for photosynthesis", which inverts it.
    - quote: Utendørs er ikke mangel på CO2 noe problem
      note: Keep the outdoor/greenhouse contrast; do not say plants generally lack CO2.
  expectations:
    - "The chemical formulas stay exactly as copied; optional notation suggestions do not change the source: CO2, H2O, C6H12O6, O2."
    - The term "glukose" is kept (it can be explained as a kind of sugar), not replaced by "sukker" alone.
    - The five factors stay a list of five; none is dropped or merged.
    - '"granum" may be left out (detail), but if kept it is not explained as anything other than the stacks of
      discs.'
    - No extra facts are added, e.g. about the equation's balancing numbers (6CO2 + 6H2O), which the source
      does not give.
    - The "matpakke" analogy may be kept as an analogy; it must not become a claim that the plant eats.
