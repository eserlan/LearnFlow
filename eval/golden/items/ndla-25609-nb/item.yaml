annotations:
  keyFacts:
    - id: f1
      statement: Oppgavene handler om hovedpunktene i emnet om klimaendringer.
      sourceQuote: Disse oppgavene tar for seg hovedpunktene i emnet om klimaendringer.
    - id: f2
      core: true
      statement: Den første oppgaven spør hvorfor dinosaurene døde ut for omtrent 65 millioner år siden.
      gist: "En oppgave spør hvorfor dinosaurene døde ut."
      sourceQuote: Hvorfor døde dinosaurene ut for omtrent 65 millioner år siden?
    - id: f3
      core: true
      statement: Fenotypiske endringer kan føre til evolusjon; eleven skal forklare hvordan.
      gist: "En oppgave ber eleven forklare hvordan fenotypiske endringer kan føre til evolusjon."
      sourceQuote: Fenotypiske endringer kan gi opphav til evolusjon. Forklar hvordan dette kan foregå.
    - id: f4
      core: true
      statement: I dag er ikke klimaendringer den største trusselen mot det biologiske mangfoldet; eleven skal forklare hvorfor de likevel får så mye oppmerksomhet.
      gist: "En oppgave spør hvorfor klimaendringer får så mye oppmerksomhet, når de i dag ikke er den største trusselen mot det biologiske mangfoldet."
      sourceQuote: Per i dag er ikke klimaendringer den største trusselen mot det biologiske mangfoldet.
    - id: f5
      core: true
      statement: Arter kan tilpasse seg miljøet uten at genmaterialet endres; eleven skal gi eksempler.
      gist: "En oppgave ber om eksempler på at arter kan tilpasse seg uten at genmaterialet endres."
      sourceQuote: uten at det skjer en endring i genmaterialet til arten
  keyTerms:
    - term: klimaendringer
    - term: fenotype
    - term: genotype
    - term: evolusjon
    - term: genetisk mangfold
    - term: biologiske mangfoldet
    - term: atferd
  mustPreserve:
    - { value: 65 millioner år, kind: number }
    - { value: fenotypiske og genotypiske endringer, kind: term }
  qualifiers:
    - quote: omtrent 65 millioner år siden
    - quote: mulige effekter
      note: Possible effects, not certain ones.
    - quote: noen arter
      note: Some species, not all.
    - quote: relativt kort tid
    - quote: Per i dag er ikke klimaendringer den største trusselen
      note: The negation and "per i dag" are both essential; easy to invert.
  expectations:
    - "All 16 questions stay, in order, as questions. None is answered."
    - "Terms that are themselves asked about (fenotype, genotype, evolusjon) are not defined or explained, because that would answer the question. The questions may be reworded more simply."
    - "Questions that contain a fact (dinosaurs 65 million years ago, climate change not the biggest threat today) keep that fact unchanged."
    - "The heading numbering \"Oppgave 7\" may be kept or dropped; tasks 1–6 were interactive and are not in the pasted text, and nothing is invented for them."
review:
  status: draft
  annotatedBy: claude-draft
  notes: Pure question list. The hard part is not answering by "explaining" a term the question asks about.
