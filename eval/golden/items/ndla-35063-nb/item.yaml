annotations:
  keyFacts:
    - id: f1
      statement: Første verdenskrig varte fra 1914 til 1918.
      sourceQuote: Første verdenskrig var en verdensomspennende krig som varte fra 1914 til 1918.
    - id: f2
      statement: Historikere skiller mellom bakenforliggende årsaker (som går bakover i tid) og den utløsende årsaken.
      sourceQuote: Bakenforliggende årsaker er årsaker til en hendelse som går bakover i tid.
    - id: f3
      statement: Wienkongressen i 1815 innførte en maktbalanse i Europa, men nasjonalismen utfordret den.
      sourceQuote: Wienkongressen i 1815 introduserte prinsippet om en europeisk maktbalanse som skulle forhindre at en stormakt ble for sterk.
    - id: f4
      statement: Tyskland ble samlet i 1871 etter å ha slått Frankrike, som måtte gi fra seg Alsace og Lorraine. Det nye Tyskland skremte de andre stormaktene.
      sourceQuote: I den tyske samlingsprosessen ble Frankrike beseiret og ydmyket i den fransk-tyske krigen (1870-1871) hvor Frankrike måtte avstå grenseområdene Alsace og Lorraine.
    - id: f5
      statement: Frankrike ville ta tilbake områdene, Russland ville samle de slaviske folkene (panslavisme), og Tyskland under Vilhelm 2. ville være en stormakt.
      sourceQuote: Frankrike hadde ikke glemt krigsnederlaget i 1871 og ønsket å ta tilbake områdene de hadde måttet avstå til Tyskland.
    - id: f6
      statement: Det ble et våpenkappløp og et flåtekappløp mellom Tyskland og Storbritannia. Utgiftene til våpen steg med femti prosent de siste årene før krigen.
      sourceQuote: De siste årene før krigsutbruddet steg utgiftene til våpenproduksjon med femti prosent for de europeiske stormaktene.
    - id: f7
      statement: Tyskland, Østerrike-Ungarn og Italia dannet trippelalliansen.
      sourceQuote: Senere ble også Italia med i alliansen, som fikk navnet trippelalliansen.
    - id: f8
      statement: Frankrike, Russland og senere Storbritannia dannet trippelententen.
      sourceQuote: Denne forståelsen ble kjent som trippelententen.
    - id: f9
      statement: Russland skulle beskytte Serbia, og Storbritannia garanterte Belgias sikkerhet.
      sourceQuote: Russland hadde en avtale med Serbia om å beskytte dem mot østerriksk aggresjon, mens Storbritannia garanterte sikkerheten til Belgia.
    - id: f10
      statement: Kappløpet om kolonier i Afrika (1870–1914) skjerpet motsetningene mellom stormaktene.
      sourceQuote: Kolonikappløpet bidro til å skjerpe motsetningene mellom de europeiske stormaktene.
    - id: f11
      statement: I Balkankrigene (1912–1913) mistet Det osmanske riket nesten alle sine områder i Europa, og Serbia vant mest. Serbia ville ha Bosnia og Hercegovina, som Østerrike-Ungarn hadde tatt i 1908.
      sourceQuote: I Balkankrigene (1912-1913) mistet Det osmanske riket nesten alle sine europeiske områder.
    - id: f12
      statement: 28. juni 1914 skjøt Gavrilo Princip, en bosnisk-serbisk nasjonalist, tronfølgeren Franz Ferdinand og kona hans i Sarajevo. Dette var den utløsende årsaken.
      sourceQuote: Her ble han og hans kone skutt og drept av en bosnisk-serbisk nasjonalist ved navn Gavrilo Princip.
    - id: f13
      statement: Østerrike-Ungarn stilte Serbia et ultimatum, og Tyskland lovet full støtte (blankofullmakten).
      sourceQuote: Tyskland ga sin alliansepartner full støtte, dersom det skulle bli krig, i det som er blitt kjent som blankofullmakten.
    - id: f14
      statement: "Krigserklæringene i rekkefølge: Østerrike-Ungarn mot Serbia 28. juli 1914, Tyskland mot Russland 1. august, Tyskland mot Frankrike to dager senere (gjennom Belgia), deretter Storbritannia mot Tyskland."
      sourceQuote: 28. juli 1914 erklærte derfor Østerrike-Ungarn krig mot Serbia.
