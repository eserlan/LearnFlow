  qualifiers:
    - quote: Det har i ettertid blitt påstått at Tyskland ønsket krig på dette tidspunktet.
      note: A claim, not a fact. Must not become "Tyskland ønsket krig".
    - quote: blir av de fleste historikere betraktet som den utløsende årsaken
      note: Most historians' view; keep the attribution.
    - quote: Noen historikere mener
    - quote: delvis for å skaffe seg mer innflytelse på Balkan, og delvis på grunn av panslavismen
      note: Two partial reasons; neither is the whole reason.
    - quote: Serbia aksepterte de fleste kravene til Østerrike-Ungarn, men ikke alle.
      note: Easy to simplify to "Serbia refused the demands", which is wrong.
    - quote: blir ofte kalt imperialismens tidsalder
    - quote: hvorfor begivenhetene øyensynlig ikke lot seg stanse
      note: '"øyensynlig": it only looked unstoppable. This links to the final question.'
    - quote: men også mindre europeiske stater var involvert
  expectations:
    - "The order of events and the dates in the July crisis stay exactly right. \"To dager senere\" is not turned into a date the source does not give."
    - "Who was in which alliance stays correct; mixing up the trippelallianse and the trippelentente is a factual error."
    - "Both \"Tenk etter\" questions stay as questions and are not answered. The text gives no answer to whether the war could have been avoided."
    - "The NRK film is referred to but not in the text; it may be left out, and its content is not described."
    - "Background causes and the trigger stay separate, as in the source."
review:
