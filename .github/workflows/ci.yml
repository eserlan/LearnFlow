name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    name: SvelteKit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: VERCEL=1 bun run build
      - run: bun run test:unit
      - run: bun run test:integration
  worker:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run check
      - run: npm run test

  pages-lockfile-temp:
    name: Regenerate Bun static adapter lockfile (temporary)
    if: github.head_ref == 'feat/cloudflare-pages-static'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Export updated lockfile for review
        run: |
          echo 'BUN_LOCK_BEGIN'
          base64 -w0 bun.lock
          echo
          echo 'BUN_LOCK_END'
