name: Generate pinned Vercel adapter lockfile (temporary)
on:
  push:
    branches: [fix/pin-vercel-adapter]
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Commit generated lockfile on this feature branch
        run: |
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock Vercel adapter dependencies"
          git push origin HEAD:fix/pin-vercel-adapter
